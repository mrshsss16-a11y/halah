name = "hala-ai-os"
compatibility_date = "2026-07-01"
# Static files staged into dist/ (repo root also holds .agents/, docs/, persona/
# which must not be uploaded). functions/ stays at project root per Pages convention.
pages_build_output_dir = "dist"

# Workers AI — text generation + embeddings, no external API key needed.
[ai]
binding = "AI"

# RAG memory: past approved marketer replies, embedded and searched by similarity.
# Reusing the pre-existing account index (1024-dim / cosine — matches bge-m3).
# Store isolation relies on a metadata index; create it once:
#   npx wrangler vectorize create-metadata-index halah-tr-faq --property-name=storeId --type=string
[[vectorize]]
binding = "VECTORIZE_INDEX"
index_name = "halah-tr-faq"

# Existing store-connections DB from the previous halah build (store_connections,
# synced_products, merchant_marketing_contexts, faqs) — ready for the Salla/Trendyol phase.
[[d1_databases]]
binding = "DB"
database_name = "halah-tr-db"
database_id = "4d8955ff-f2db-4447-8817-fe1149cce582"

# Fast KV cache — AI response caching + rate-metering (prevents D1 write lock contention)
# Created via: npx wrangler kv namespace create HALA_CACHE
[[kv_namespaces]]
binding = "HALA_CACHE"
id = "be9f9242e8c14cf5be6f50e75ef43bf7"

# NOTE (2026-09-06): [observability] was tried here for centralized logs/traces,
# but Cloudflare Pages config validation rejects it outright — "Configuration
# file for Pages projects does not support 'observability'" — it's a Workers-only
# key, and this project is Pages (see AGENT.md §4: no _worker.js, no Advanced
# Mode). Live-tested: `npm run deploy` failed immediately with this block present.
# D2/D3 (docs/PARALLEL_TRACKS.md §أ.٤) cover the same need without it — structured
# error logging to D1 (`error_log` table) queryable via /api/admin/errors.
# Do not re-add this key unless Cloudflare ships Pages support for it.

