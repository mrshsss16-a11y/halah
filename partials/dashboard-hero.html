    <!-- شريط ترحيب بعد ربط سلة الناجح (U1) — لا يظهر إلا إذا جاءت الصفحة
         مباشرة من تحويل auth/salla/callback.js (?connected=1)، ولا يبقى
         بعد إعادة تحميل الصفحة كي لا يكذب بترحيب متكرر. -->
    <div id="connectedBanner" class="hidden p-3.5 rounded-xl text-xs font-bold bg-emerald-50 text-emerald-800 border border-emerald-300 flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" class="hgi text-base" aria-hidden="true" focusable="false"><path d="M22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12Z" stroke="currentColor" stroke-width="1.5"/><path d="M8 12.5L10.5 15L16 9" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg>
      <span>تم ربط متجرك بسلة بنجاح — جاهزين نبدأ بوصف منتجاتك.</span>
    </div>

    <!-- Header + store status -->
    <div class="sleek-card-darkborder rounded-3xl p-7 bg-white flex flex-col md:flex-row md:items-center justify-between gap-5 shadow-sm">
      <div class="space-y-2">
        <h1 id="merchantHeroHeader" class="text-2xl md:text-3xl font-black text-black leading-tight">لوحة تحكم متجرك</h1>
        <p id="merchantHeroSub" class="text-xs text-slate-600 font-medium">وصف منتجات من صورها · حزمة سيو كاملة · نشر بموافقتك على سلة</p>
      </div>
      <div class="flex flex-wrap items-center gap-3">
        <div class="text-center px-4 py-2.5 rounded-2xl bg-slate-50 border border-slate-200">
          <span class="block text-[11px] text-slate-600 font-bold">أوصاف اليوم</span>
          <span id="kpiUsageDesc" class="skel text-lg font-black text-black">٠٠/٠٠</span>
        </div>
        <!-- لا عدّاد ثانٍ هنا (2026-09-10). «رسائل الشهر» أُزيل مع تبويب الوكيل، ثم
             «صور الشهر» الذي حلّ مكانه كان خطأً: دلو `image` يُستهلك فقط بتوليد
             الصور من لوحة الأدمن (`/api/image`)، لا بتحليل صورة المنتج داخل
             الوصف — فكان عدّاداً متجمّداً أبداً أمام التاجر. الحصة الحقيقية
             الوحيدة: الأوصاف، وكل وصف يشمل تحليل صورته. -->
        <div id="storeLinkBadge" class="text-center px-4 py-2.5 rounded-2xl bg-slate-50 border border-slate-200">
          <span class="block text-[11px] text-slate-600 font-bold">حالة المتجر</span>
          <span id="storeLinkState" class="skel text-xs font-black text-black">جاري الفحص…</span>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex flex-wrap items-center gap-2 border-b border-slate-200 pb-3">

    </div>
