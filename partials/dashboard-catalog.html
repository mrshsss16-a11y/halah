    <!-- ── 0. My products (Salla catalog) ──────────────────────
         جوهر المنتج: التاجر يشوف منتجاته الحقيقية ويضغط واحداً، فتتعبّى حقول
         الاستوديو من سلة ويبدأ التوليد فوراً — صفر كتابة أو لصق يدوي. -->
    <section id="sectionCatalog" class="space-y-5">
      <div class="sleek-card rounded-3xl p-6 space-y-4 shadow-sm">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-200 pb-4">
          <div class="space-y-1">
            <h2 class="text-lg font-black text-black">منتجاتي</h2>
            <p id="catalogCountLine" class="text-xs text-slate-600 font-medium">اضغط أي منتج ويكتب الوصف تلقائياً من صورته ووصفه الحالي.</p>
          </div>
          <button id="catalogSyncBtn" onclick="startCatalogSync()" class="sleek-btn-black px-4 py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2 whitespace-nowrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" class="hgi text-base" aria-hidden="true" focusable="false"><path d="M20.5 5.5H9.5C5.78672 5.5 3 8.18503 3 12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M3.5 18.5H14.5C18.2133 18.5 21 15.815 21 12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M18.5 3C18.5 3 21 4.84122 21 5.50002C21 6.15882 18.5 8 18.5 8" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M5.49998 16C5.49998 16 3.00001 17.8412 3 18.5C2.99999 19.1588 5.5 21 5.5 21" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg>
            <span id="catalogSyncBtnText">اسحب منتجاتي من سلة</span>
          </button>
        </div>

        <div id="catalogFeedback" class="hidden p-3.5 rounded-xl text-xs font-bold bg-slate-100 text-black border border-black"></div>

        <div id="catalogLoading" class="hidden text-xs text-slate-500 font-medium py-6 text-center">جاري تحميل منتجاتك…</div>

        <!-- ── اختيار متعدد: التاجر يشوف الصور ويحدد أي منتجات تُوصف ── -->
        <div id="catalogSelectBar" class="hidden flex flex-wrap items-center gap-2 p-3 rounded-2xl bg-slate-50 border border-slate-200">
          <span id="catalogSelectCount" class="text-xs font-black text-black">محدد: ٠</span>
          <button onclick="selectAllCatalog(true)" class="sleek-btn-white px-3 py-1.5 rounded-xl text-[11px] font-bold">تحديد كل المعروض</button>
          <button onclick="selectAllCatalog(false)" class="sleek-btn-white px-3 py-1.5 rounded-xl text-[11px] font-bold">إلغاء التحديد</button>
          <button id="catalogSelectedGenBtn" onclick="generateSelectedCatalog()" disabled
                  class="sleek-btn-black px-4 py-1.5 rounded-xl text-[11px] font-bold flex items-center gap-1.5 opacity-50 cursor-not-allowed">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" class="hgi text-sm" aria-hidden="true" focusable="false"><path d="M15 2L15.5387 4.39157C15.9957 6.42015 17.5798 8.00431 19.6084 8.46127L22 9L19.6084 9.53873C17.5798 9.99569 15.9957 11.5798 15.5387 13.6084L15 16L14.4613 13.6084C14.0043 11.5798 12.4202 9.99569 10.3916 9.53873L8 9L10.3916 8.46127C12.4201 8.00431 14.0043 6.42015 14.4613 4.39158L15 2Z" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5"/><path d="M7 12L7.38481 13.7083C7.71121 15.1572 8.84275 16.2888 10.2917 16.6152L12 17L10.2917 17.3848C8.84275 17.7112 7.71121 18.8427 7.38481 20.2917L7 22L6.61519 20.2917C6.28879 18.8427 5.15725 17.7112 3.70827 17.3848L2 17L3.70827 16.6152C5.15725 16.2888 6.28879 15.1573 6.61519 13.7083L7 12Z" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5"/></svg>
            <span id="catalogSelectedGenText">ولّد أوصاف المحدد</span>
          </button>
          <span class="text-[11px] text-slate-500 font-medium">كل وصف يمرّ على مراجعتك قبل النشر.</span>
        </div>

        <div id="catalogEmpty" class="hidden text-center py-10 space-y-2">
          <span id="catalogEmptyIcon" class="inline-flex text-4xl text-slate-300"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" class="hgi" aria-hidden="true" focusable="false"><path d="M2.5 7.5V13.5C2.5 17.2712 2.5 19.1569 3.67157 20.3284C4.84315 21.5 6.72876 21.5 10.5 21.5H13.5C17.2712 21.5 19.1569 21.5 20.3284 20.3284C21.5 19.1569 21.5 17.2712 21.5 13.5V7.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M3.86909 5.31461L2.5 7.5H21.5L20.2478 5.41303C19.3941 3.99021 18.9673 3.2788 18.2795 2.8894C17.5918 2.5 16.7621 2.5 15.1029 2.5H8.95371C7.32998 2.5 6.51812 2.5 5.84013 2.8753C5.16215 3.2506 4.73113 3.93861 3.86909 5.31461Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M12 7.5V2.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M10 10.5H14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg></span>
          <p id="catalogEmptyTitle" class="text-xs text-slate-600 font-bold">ما سحبنا منتجاتك بعد — اضغط "اسحب منتجاتي من سلة"</p>
          <p id="catalogEmptyHint" class="text-[11px] text-slate-500">تظهر أول دفعة منتجات فوراً، وإن كان متجرك كبير يوصل الباقي خلال دقائق.</p>
        </div>

        <div id="catalogGrid" class="hidden grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>

        <button id="catalogMoreBtn" onclick="loadCatalogMore()" class="hidden w-full sleek-btn-white py-3 rounded-xl text-xs transition">عرض المزيد</button>
      </div>

      <!-- لوحة الوصف — تُفتح تحت الشبكة عند اختيار منتج، والشبكة تبقى ظاهرة. -->
      <!--#include partials/dashboard-studio.html-->

      <!-- المراجعة الجماعية — نفس المكان: نتائج «ولّد أوصاف المحدد» تظهر هنا. -->
      <!--#include partials/dashboard-review.html-->

    </section>
