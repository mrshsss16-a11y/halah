    <section id="sectionImages" class="hidden space-y-6">
      <div class="sleek-white-card-darkborder rounded-3xl p-7 bg-white text-black space-y-5 shadow-md">
        <div class="space-y-1 border-b border-slate-200 pb-5">
          <span class="text-xs font-mono font-bold text-black bg-slate-100 border border-slate-300 px-3 py-1 rounded-full">CLOSED BETA</span>
          <h2 class="text-xl font-black text-black">توليد صور المنتجات</h2>
          <p class="text-xs text-slate-600 font-medium">
            مرحلة تجريبية مغلقة على حسابك فقط — غير متاحة للتجار. تستهلك رصيدك اليومي.
          </p>
        </div>

        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-black mb-1">صورة المنتج:</label>
            <input id="imgFile" type="file" accept="image/*" onchange="previewProductImage(event)" class="w-full bg-white border border-slate-300 text-xs rounded-xl p-3 text-black font-medium focus:outline-none focus:border-black"/>
            <p class="text-[11px] text-slate-500 font-medium mt-1">تُصغَّر تلقائياً إلى ٥١٢×٥١٢ قبل الإرسال.</p>
          </div>

          <div>
            <label class="block text-xs font-bold text-black mb-1">الطابع البصري:</label>
            <select id="imgStyle" class="w-full bg-white border border-slate-300 text-xs rounded-xl p-3 text-black font-bold focus:outline-none focus:border-black">
              <option value="minimal-white">أبيض بسيط (Minimal White)</option>
              <option value="luxury-dark">فخامة داكنة (Luxury Dark)</option>
              <option value="warm-heritage">دفء تراثي (Warm Heritage)</option>
              <option value="bold-modern">حداثة جريئة (Bold Modern)</option>
            </select>
          </div>

          <button id="imgBtn" onclick="generateProductImageAdmin()" class="w-full bg-black text-white font-bold py-3.5 rounded-xl text-xs transition flex items-center justify-center gap-2 hover:bg-slate-800">
            <span class="material-symbols-outlined text-base">auto_awesome</span>
            <span id="imgBtnText">ولّد الصورة</span>
          </button>

          <div id="imgFeedback" class="hidden p-3.5 rounded-xl text-xs font-bold bg-slate-100 text-black border border-black"></div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="space-y-2">
            <span class="text-[11px] font-bold text-slate-600 block">الأصل</span>
            <img id="imgBefore" alt="صورة المنتج الأصلية" class="hidden w-full rounded-2xl border border-slate-300"/>
          </div>
          <div class="space-y-2">
            <span class="text-[11px] font-bold text-slate-600 block">النتيجة</span>
            <img id="imgAfter" alt="صورة المنتج المولّدة" class="hidden w-full rounded-2xl border border-black"/>
            <a id="imgDownload" class="hidden text-[11px] font-bold text-slate-600 hover:text-black underline" download="hala-product.png">تحميل الصورة</a>
          </div>
        </div>
      </div>
    </section>
