      <!-- ── تغذية راجعة (المرحلة ٤): سؤال واحد، مرة واحدة ── -->
      <div id="feedbackCard" class="hidden sleek-card rounded-3xl p-5 space-y-3 shadow-sm border border-black">
        <div class="flex items-start justify-between gap-3">
          <div>
            <h3 class="text-sm font-black text-black">كيف تجربتك مع هالة لين الآن؟</h3>
            <p class="text-[13px] text-slate-600 font-medium">تقييمك يوصلنا مباشرة — سؤال واحد بس.</p>
          </div>
          <button type="button" onclick="dismissFeedback()" class="text-slate-400 hover:text-black" title="لاحقاً" aria-label="إغلاق سؤال التقييم"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" class="hgi text-base" aria-hidden="true" focusable="false"><path d="M18 6L6.00081 17.9992M17.9992 18L6 6.00085" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg></button>
        </div>
        <div class="flex gap-2" id="feedbackStars">
          <button onclick="pickFeedbackScore(1)" data-score="1" class="fb-star sleek-btn-white w-10 h-10 rounded-xl text-sm font-black">١</button>
          <button onclick="pickFeedbackScore(2)" data-score="2" class="fb-star sleek-btn-white w-10 h-10 rounded-xl text-sm font-black">٢</button>
          <button onclick="pickFeedbackScore(3)" data-score="3" class="fb-star sleek-btn-white w-10 h-10 rounded-xl text-sm font-black">٣</button>
          <button onclick="pickFeedbackScore(4)" data-score="4" class="fb-star sleek-btn-white w-10 h-10 rounded-xl text-sm font-black">٤</button>
          <button onclick="pickFeedbackScore(5)" data-score="5" class="fb-star sleek-btn-white w-10 h-10 rounded-xl text-sm font-black">٥</button>
        </div>
        <textarea id="feedbackComment" rows="2" placeholder="شي حبّيته أو شي عطّلك؟ (اختياري)" class="w-full bg-white border border-slate-300 text-xs rounded-xl p-3 text-black font-medium focus:outline-none focus:border-black"></textarea>
        <div class="flex items-center gap-2">
          <button id="feedbackSendBtn" onclick="sendFeedback()" class="sleek-btn-black px-4 py-2 rounded-xl text-xs" disabled>أرسل</button>
          <span id="feedbackMsg" class="text-[13px] font-bold text-slate-600"></span>
        </div>
      </div>

      <!-- ── المراجعة الجماعية (المرحلة ٢): الـAI يقترح، التاجر يقرر ── -->
      <!-- نافذة «المراجعة والنشر» (طلب المالك 2026-09-13): كانت قسماً ثابتاً تحت المنتجات يعرض أصفاراً ورسائل حتى بلا
           أوصاف. تُفتح من زر شريط «منتجاتي» (catalogSelectBar)، ونافذة «قبل وبعد» تُفتح وحدها بعد التوليد الجماعي. -->
      <div id="reviewPanel" class="hidden fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm flex items-start sm:items-center justify-center p-3 overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="reviewPanelTitle">
      <div id="reviewCard" class="sleek-card bg-white rounded-3xl p-6 space-y-4 shadow-xl w-full max-w-3xl max-h-[92vh] overflow-hidden flex flex-col">
        <!-- 2026-09-17 (طلب المالك — «العناصر مضغوطة والأزرار كثيرة»): رأس بزر
             رئيسي واحد + قائمة ⋯ للثانوي بدل ٣ أزرار متزاحمة. shrink-0 على كل
             جزء ثابت، والقائمة وحدها flex-1 القابلة للتمرير — لا تراكب بأي حجم. -->
        <div class="flex items-start justify-between gap-3 border-b border-slate-200 pb-4 flex-wrap shrink-0">
          <div class="space-y-1 min-w-0">
            <h2 id="reviewPanelTitle" class="text-lg font-black text-black">المراجعة والنشر</h2>
            <p id="reviewCountsLine" class="text-xs text-slate-600 font-medium">أوصاف «ولّد المحدد» و«ولّد للكل» تنتظرك هنا. ما يُنشر على سلة إلا ما تعتمده.</p>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <button id="reviewModalBtn" type="button" onclick="openReviewModal()" class="hidden sleek-btn-black px-4 py-2 rounded-xl text-xs transition">راجعها واحداً واحداً (<span id="rvModalCount">0</span>)</button>
            <details class="rm-more shrink-0">
              <summary aria-label="خيارات أخرى">⋯</summary>
              <div class="rm-more-pop">
                <button type="button" onclick="decideReview('approve_all')" class="w-full">اعتمد الكل وانشره</button>
                <button type="button" onclick="reloadReview()" class="w-full flex items-center gap-1"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" class="hgi text-base" aria-hidden="true" focusable="false"><path d="M20.0092 2V5.13219C20.0092 5.42605 19.6418 5.55908 19.4537 5.33333C17.6226 3.2875 14.9617 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg><span>تحديث</span></button>
              </div>
            </details>
            <button type="button" onclick="closeReviewPanel()" class="sleek-btn-white w-9 h-9 rounded-xl text-sm font-bold flex items-center justify-center shrink-0" aria-label="إغلاق نافذة المراجعة">×</button>
          </div>
        </div>

        <!-- شريط تبويبات صف واحد قابل للتمرير أفقياً — لا يتراكب مع أي زر بأي عرض. -->
        <div class="rv-tabs flex gap-2 overflow-x-auto flex-nowrap text-[13px] font-bold shrink-0">
          <button data-state="pending" onclick="loadReview('pending')" class="review-tab tab-on px-3 py-1.5 rounded-lg whitespace-nowrap shrink-0">بانتظار مراجعتك <span id="rvPending">0</span></button>
          <button data-state="awaiting_publish" onclick="loadReview('awaiting_publish')" class="review-tab tab-off px-3 py-1.5 rounded-lg whitespace-nowrap shrink-0">معتمد <span id="rvAwaiting">0</span></button>
          <button data-state="published" onclick="loadReview('published')" class="review-tab tab-off px-3 py-1.5 rounded-lg whitespace-nowrap shrink-0">نُشر <span id="rvPublished">0</span></button>
          <button data-state="publish_failed" onclick="loadReview('publish_failed')" class="review-tab tab-off px-3 py-1.5 rounded-lg whitespace-nowrap shrink-0">فشل <span id="rvFailed">0</span></button>
          <button data-state="rejected" onclick="loadReview('rejected')" class="review-tab tab-off px-3 py-1.5 rounded-lg whitespace-nowrap shrink-0">مرفوض <span id="rvRejected">0</span></button>
        </div>

        <div id="reviewScroll" class="flex-1 min-h-0 overflow-y-auto space-y-2">
          <div id="reviewFeedback" class="hidden p-3.5 rounded-xl text-xs font-bold bg-slate-100 text-black border border-black"></div>
          <div id="reviewLoading" role="status" class="hidden text-xs text-slate-500 font-medium py-6 text-center">جاري التحميل…</div>
          <div id="reviewEmpty" class="hidden text-xs text-slate-500 font-medium py-6 text-center">ما فيه أوصاف بانتظار مراجعتك. حدّد منتجات من «منتجاتي» واضغط «ولّد المحدد».</div>
          <div id="reviewList" class="space-y-2"></div>
        </div>
      </div>
      </div>
