      <!-- ── نموذج الاستوديو (2026-09-13): يظهر فقط بعد اختيار منتج حقيقي من
           «منتجاتي» — أُزيل مساران بلا وجهة نشر فعلية: لصق قائمة يدوية بـSKU
           مطبوع يدوياً (لا رابط بمنتج حقيقي)، وفتح النموذج فارغاً لمنتج "مو
           بسلة بعد" (publishToSalla يرفض بلا productId من الكتالوج أصلاً —
           توليد بلا أي مسار نشر ممكن). التوليد الحقيقي دائماً من كتالوج مسحوب. -->
      <div id="studioManual" class="sleek-card rounded-3xl p-5 space-y-3 shadow-sm hidden">
        <div class="space-y-4 pt-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <input id="pName" type="text" placeholder="اسم المنتج (مثال: عطر عود ملكي 100مل)" class="w-full bg-white border border-slate-300 text-xs rounded-xl p-3 text-black font-medium focus:outline-none focus:border-black"/>
          <input id="pPrice" type="number" placeholder="السعر (ر.س)" class="w-full bg-white border border-slate-300 text-xs rounded-xl p-3 text-black font-medium focus:outline-none focus:border-black"/>
          <input id="pCategory" type="text" placeholder="الفئة (عطور، عبايات، تمور…)" class="w-full bg-white border border-slate-300 text-xs rounded-xl p-3 text-black font-medium focus:outline-none focus:border-black"/>
        </div>
        <textarea id="pFeatures" rows="2" placeholder="مزايا المنتج (اختياري) — افصل بينها بفاصلة" class="w-full bg-white border border-slate-300 text-xs rounded-xl p-3 text-black font-medium focus:outline-none focus:border-black"></textarea>

        <!-- المسار الأساسي: هذين الحقلين يُعبّآن آلياً من بطاقة "منتجاتي".
             يبقيان ظاهرين وقابلين للتعديل للمسار اليدوي (منتج مو بسلة بعد). -->
        <div id="studioSourceBanner" class="hidden p-3 rounded-xl bg-slate-50 border border-slate-300 text-[11px] font-bold text-black flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" class="hgi text-base" aria-hidden="true" focusable="false"><path d="M2.5 7.5V13.5C2.5 17.2712 2.5 19.1569 3.67157 20.3284C4.84315 21.5 6.72876 21.5 10.5 21.5H13.5C17.2712 21.5 19.1569 21.5 20.3284 20.3284C21.5 19.1569 21.5 17.2712 21.5 13.5V7.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M3.86909 5.31461L2.5 7.5H21.5L20.2478 5.41303C19.3941 3.99021 18.9673 3.2788 18.2795 2.8894C17.5918 2.5 16.7621 2.5 15.1029 2.5H8.95371C7.32998 2.5 6.51812 2.5 5.84013 2.8753C5.16215 3.2506 4.73113 3.93861 3.86909 5.31461Z" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M12 7.5V2.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/><path d="M10 10.5H14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg>
          <span id="studioSourceText"></span>
        </div>

        <div class="space-y-2.5">
          <label for="pImageUrl" class="block text-[11px] font-bold text-slate-600">صورة المنتج — يحلّلها فعلياً (لون، خامة، شكل) قبل الكتابة</label>
          <input id="pImageUrl" type="text" placeholder="تُعبَّأ تلقائياً لما تختار منتجاً من «منتجاتي» — أو الصق رابط صورة" class="w-full bg-white border border-slate-300 text-xs rounded-xl p-3 text-black font-medium focus:outline-none focus:border-black" dir="ltr"/>
        </div>

        <details class="text-xs">
          <summary class="cursor-pointer font-bold text-slate-600 select-none">الوصف الحالي للمنتج (اختياري — يُعبَّأ تلقائياً من سلة)</summary>
          <div class="space-y-2.5 pt-2.5">
            <textarea id="pExistingDescription" rows="3" placeholder="وصف المنتج الحالي بمتجرك — الذكاء الاصطناعي يحسّن صياغته وSEO بدل ما يخترع وصفاً عاماً من الاسم بس" class="w-full bg-white border border-slate-300 text-xs rounded-xl p-3 text-black font-medium focus:outline-none focus:border-black"></textarea>
          </div>
        </details>

        <button id="genBtn" onclick="generateCopy()" class="w-full sleek-btn-black py-3.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" class="hgi text-base" aria-hidden="true" focusable="false"><path d="M15 2L15.5387 4.39157C15.9957 6.42015 17.5798 8.00431 19.6084 8.46127L22 9L19.6084 9.53873C17.5798 9.99569 15.9957 11.5798 15.5387 13.6084L15 16L14.4613 13.6084C14.0043 11.5798 12.4202 9.99569 10.3916 9.53873L8 9L10.3916 8.46127C12.4201 8.00431 14.0043 6.42015 14.4613 4.39158L15 2Z" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5"/><path d="M7 12L7.38481 13.7083C7.71121 15.1572 8.84275 16.2888 10.2917 16.6152L12 17L10.2917 17.3848C8.84275 17.7112 7.71121 18.8427 7.38481 20.2917L7 22L6.61519 20.2917C6.28879 18.8427 5.15725 17.7112 3.70827 17.3848L2 17L3.70827 16.6152C5.15725 16.2888 6.28879 15.1573 6.61519 13.7083L7 12Z" stroke="currentColor" stroke-linejoin="round" stroke-width="1.5"/></svg>
          <span id="genBtnText">اكتب الوصف الآن</span>
        </button>

        </div>
      </div>
