  <script>
    // داخل إطار لوحة سلة: وسم الجذر **قبل أول رسم** كي لا يومض شريطنا ثم يختفي.
    // دليل تصميم التطبيقات المضمّنة يمنع شريطاً علوياً خاصاً بالتطبيق (2026-09-10).
    try { if (window.self !== window.top) document.documentElement.classList.add("in-salla-frame"); }
    catch (e) { document.documentElement.classList.add("in-salla-frame"); }

    // زائر بلا جلسة كان يرى لوحة التاجر كاملة (منتجات/متجر/تبويبات) للحظة قبل
    // أن يحسم main.js نتيجة /api/auth/me ويحوّل لتسجيل الدخول — وميض أمني: شكل
    // اللوحة نفسه بيانات حساسة (2026-09-13). الوسم هنا يسبق حتى أول رسم لـ<body>،
    // فقاعدة CSS بأسفل partials/dashboard-head.html تخفيه فوراً؛ main.js هو من
    // يزيل الوسم بعد أن يعرف حال الجلسة — إن كان غير مسجَّل يحوِّل المتصفح بدل
    // إزالته، فلا يظهر شيء من اللوحة إطلاقاً.
    document.documentElement.classList.add("auth-pending");
  </script>

  <script>

    // browser console: "Uncaught ReferenceError: process is not defined"
    // thrown from inside the SDK, which silently breaks its postMessage
    // handshake before it ever reaches Salla's parent frame. Browsers have no
    // `process`; this shim is the standard workaround for Node-targeted
    // bundles loaded directly in a browser. Must run before the SDK script.
    window.process = window.process || { env: {} };
  </script>
  <!-- Salla Embedded App SDK — required when this page is opened inside a

  <style>
    body { font-family: 'IBM Plex Sans Arabic', 'Tajawal', 'Readex Pro', sans-serif; background: #FFFFFF; color: #000000; }
    /* يقابل وسم auth-pending أعلاه — يمنع وميض لوحة التاجر لزائر بلا جلسة
       (2026-09-13). visibility لا display: كي لا تتغيّر أبعاد التخطيط أو
       تتأخر قراءة عناصر main.js لـgetElementById قبل الإزالة. main.js يزيل

       لأن الإزالة تسبق أول رسم فعلي بجزء من الثانية فقط (نداء شبكة واحد). */
    html.auth-pending body { visibility: hidden; }
    /* .sleek-card / .sleek-btn-black / .sleek-btn-white من /style.css (styles/08-shared-components.css). */

    .rv-tabs { scrollbar-width: none; -ms-overflow-style: none; }

    .skel { position: relative; overflow: hidden; background: #E2E8F0; border-radius: 6px; color: transparent !important; }

    /* ── ألوان سلة بالوضع الفاتح داخل الإطار (دليل التصميم: الأساسي #004d5b للعناوين

    .in-salla-frame:not(.salla-dark) body,

    /* ── DESIGN_SPEC 2026-09-16 §1 (Package C): مقياس النصوص داخل إطار سلة ──
       فيديو المالك يصوّر اللوحة مضغوطة داخل إطار سلة (~1000×470)؛ نصوص 10-11px

       و12px فقط للبيانات الوصفية (SKU، سعر·تصنيف، شارات، طوابع زمنية). */

    /* ── §2: نافذة المراجعة كورقة ملء الشاشة بالإطارات القصيرة (≤640px ارتفاع) ──

    .rm-sheet { display:flex; flex-direction:column; min-height:0; }
    .rm-sheet > * { min-height: 0; }

      #rmSub, #notesSub { display: none; }
      #rmTitle, #notesTitle { font-size: 15px; }
      .rm-head { padding: 6px 12px !important; }

    .rm-more { position: relative; }

    .rm-before { min-width: 0; }

    @media (prefers-reduced-motion: no-preference) {
