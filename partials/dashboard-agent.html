    <!-- ── 2. Store customer-service agent ────────────────────── -->
    <section id="sectionAgent" class="hidden space-y-5">

      <!-- بطاقتا «ربط واتساب» و«تركيب المساعد بموقعك» مخفيّتان عمداً (2026-09-10).
           كلتاهما تعرض على التاجر باباً لا يُفتح اليوم:
             - ربط واتساب: يحتاج اعتماد Meta كـTech Provider، فالزر معطّل دائماً.
             - كود الودجت: مسموح المصادر `WIDGET_ALLOWED_ORIGINS` متغيّر بيئة واحد
               (aura.sa)، فالنسخ على دومين التاجر يُحجب بـCORS — ميزة تبدو جاهزة
               وتفشل صامتة.
           الشيفرة الخلفية باقية كما هي؛ الترميز يعود من git حين تُعتمد الميزتان. -->

      <div class="sleek-card rounded-3xl p-6 space-y-4 shadow-sm">
        <div class="space-y-1 border-b border-slate-200 pb-4">
          <h2 class="text-lg font-black text-black">وكيل خدمة عملاء متجرك</h2>
          <p class="text-xs text-slate-600 font-medium">يرد على عملاء متجرك بلهجتك — اضبط اللهجة والتعليمات، وجرّبه مباشرة</p>
        </div>

        <div class="space-y-3">
          <div>
            <label class="block text-xs font-bold text-black mb-1">لهجة الوكيل:</label>
            <select id="agentDialect" class="w-full bg-white border border-slate-300 text-xs rounded-xl p-3 text-black font-bold focus:outline-none focus:border-black">
              <option value="saudi_najdi">سعودي أبيض — نجدية خفيفة</option>
              <option value="saudi_hijazi">سعودي أبيض — حجازية لطيفة</option>
              <option value="fusha_friendly">فصحى عصرية ودية</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-black mb-1">تعليمات خاصة بمتجرك:</label>
            <textarea id="agentInstructions" rows="4" placeholder="مثال: التوصيل ٢-٤ أيام داخل الرياض. الاسترجاع خلال ١٤ يوم. لا نبيع بالجملة." class="w-full bg-white border border-slate-300 text-xs rounded-xl p-3 text-black font-medium focus:outline-none focus:border-black"></textarea>
          </div>
          <button onclick="saveAgentContext()" class="w-full sleek-btn-black py-3 rounded-xl text-xs transition">حفظ وتطبيق</button>
          <div id="agentFeedback" class="hidden p-3 rounded-xl text-xs font-bold bg-slate-100 text-black border border-black"></div>
        </div>
      </div>

      <div class="sleek-card rounded-3xl p-6 space-y-3 shadow-sm">
        <h3 class="text-sm font-black text-black border-b border-slate-200 pb-3">جرّب وكيلك</h3>
        <div id="chatLog" class="space-y-2 max-h-72 overflow-y-auto text-xs"></div>
        <div class="flex gap-2">
          <input id="chatInput" type="text" placeholder="اكتب سؤال عميل…" onkeydown="if(event.key==='Enter')sendChat()" class="flex-1 bg-white border border-slate-300 text-xs rounded-xl p-3 text-black font-medium focus:outline-none focus:border-black"/>
          <button onclick="sendChat()" class="sleek-btn-black px-5 rounded-xl text-xs transition">إرسال</button>
        </div>
      </div>
    </section>
