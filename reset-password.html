<!DOCTYPE html>
<html dir="rtl" lang="ar" data-theme="light">
<head>
  <!--#include partials/head-common.html-->
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <!-- التوكن يعيش بجزء # من الرابط (لا يصل لأي خادم)، ولا Referer يُرسل منه لأي مكان. -->
  <meta name="referrer" content="no-referrer"/>
  <meta name="robots" content="noindex"/>
  <title>هالة | تعيين كلمة مرور جديدة</title>
  <style>
    body { font-family: 'IBM Plex Sans Arabic', 'Tajawal', 'Readex Pro', sans-serif; background: #FFFFFF; color: #000000; }
    .wire-box { background: #FFFFFF; border: 1px solid #000000; }
    .wire-btn { background: #000000; color: #FFFFFF; font-weight: 700; }
    .wire-btn:hover { background: #1E293B; }
    .wire-btn:disabled { opacity: .5; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative bg-white text-black">
  <main class="max-w-md w-full mx-auto p-6 my-auto pt-16">
    <div class="wire-box rounded-3xl p-7 space-y-5 text-right shadow-lg bg-white">
      <div class="space-y-1 text-center">
        <h1 class="text-xl font-black text-black flex items-center justify-center gap-2">
          <span class="material-symbols-outlined">lock_reset</span>
          <span>تعيين كلمة مرور جديدة</span>
        </h1>
        <p class="text-xs text-slate-600 font-medium">الرابط يعمل مرة واحدة وصالح ٣٠ دقيقة من طلبه.</p>
      </div>

      <div id="resetFeedback" class="hidden p-3 rounded-xl text-xs font-bold border"></div>

      <form id="resetForm" class="space-y-3.5">
        <div>
          <label for="resetPassword" class="block text-xs font-bold text-black mb-1">كلمة المرور الجديدة:</label>
          <input id="resetPassword" type="password" required minlength="8" maxlength="200" autocomplete="new-password" placeholder="٨ أحرف على الأقل" class="w-full bg-white border border-slate-300 text-xs rounded-xl px-3.5 py-3 text-black font-medium focus:outline-none focus:border-black"/>
        </div>
        <div>
          <label for="resetPasswordConfirm" class="block text-xs font-bold text-black mb-1">أعد كتابتها:</label>
          <input id="resetPasswordConfirm" type="password" required minlength="8" maxlength="200" autocomplete="new-password" class="w-full bg-white border border-slate-300 text-xs rounded-xl px-3.5 py-3 text-black font-medium focus:outline-none focus:border-black"/>
        </div>
        <button id="resetBtn" type="submit" class="w-full wire-btn py-3.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2">
          <span>حفظ كلمة المرور</span>
          <span class="material-symbols-outlined text-base">check_circle</span>
        </button>
      </form>

      <p class="text-center text-xs"><a href="/login" class="font-bold text-slate-600 hover:text-black underline">العودة لتسجيل الدخول</a></p>
    </div>
  </main>

  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-600">
    <p>© 2026 <strong>أورا للتسويق (Aura Marketing)</strong></p>
  </footer>

  <script>
    (function () {
      var params = new URLSearchParams((window.location.hash || '').replace(/^#/, ''));
      var resetToken = params.get('token') || '';
      // أزل التوكن من شريط العنوان والسجل فوراً.
      if (window.location.hash) history.replaceState(null, '', window.location.pathname);

      var form = document.getElementById('resetForm');
      var fb = document.getElementById('resetFeedback');
      var btn = document.getElementById('resetBtn');

      function show(kind, msg) {
        fb.classList.remove('hidden');
        fb.className = kind === 'ok'
          ? 'p-3 rounded-xl text-xs font-bold bg-emerald-100 text-emerald-900 border border-emerald-300'
          : 'p-3 rounded-xl text-xs font-bold bg-rose-100 text-rose-900 border border-rose-300';
        fb.innerText = msg;
      }

      if (!/^[A-Za-z0-9_-]{43}$/.test(resetToken)) {
        form.classList.add('hidden');
        show('err', 'الرابط ناقص أو غير صالح. اطلب رابطاً جديداً من «نسيت كلمة المرور؟» بصفحة الدخول.');
        return;
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var pw = document.getElementById('resetPassword').value;
        var pw2 = document.getElementById('resetPasswordConfirm').value;
        if (pw.length < 8) return show('err', 'كلمة المرور يجب أن تكون ٨ أحرف على الأقل.');
        if (pw !== pw2) return show('err', 'كلمتا المرور غير متطابقتين.');
        btn.disabled = true;
        try {
          var res = await fetch('/api/auth/reset_password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: resetToken, newPassword: pw })
          });
          var data = await res.json();
          if (data && data.ok) {
            form.classList.add('hidden');
            show('ok', data.message || 'تم تحديث كلمة المرور.');
            setTimeout(function () { window.location.href = '/login'; }, 2500);
          } else {
            show('err', (data && data.error) || 'تعذّر تحديث كلمة المرور.');
            btn.disabled = false;
          }
        } catch (err) {
          show('err', 'تعذّر الاتصال بالخادم. حاول مرة أخرى.');
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
